apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bobravoz-grpc.fullname" . }}-allow-hub-traffic
  labels:
  {{- include "bobravoz-grpc.labels" . | nindent 4 }}
spec:
  ingress:
  - from:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          transport.bobravoz.bubustack.io/connector: "true"
    ports:
    - port: 9000
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bobravoz-grpc
      control-plane: controller-manager
  policyTypes:
  - Ingress
