apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bobravoz-grpc.fullname" . }}-allow-health-probe-traffic
  labels:
  {{- include "bobravoz-grpc.labels" . | nindent 4 }}
spec:
  ingress:
  - ports:
    - port: 8081
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bobravoz-grpc
      control-plane: controller-manager
  policyTypes:
  - Ingress
