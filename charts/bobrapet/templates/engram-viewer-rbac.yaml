apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bobrapet.fullname" . }}-engram-viewer-role
  labels:
  {{- include "bobrapet.labels" . | nindent 4 }}
rules:
- apiGroups:
  - bubustack.io
  resources:
  - engrams
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - bubustack.io
  resources:
  - engrams/status
  verbs:
  - get
