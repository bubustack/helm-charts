apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bobrapet.fullname" . }}-catalog-impulsetemplate-admin-role
  labels:
  {{- include "bobrapet.labels" . | nindent 4 }}
rules:
- apiGroups:
  - catalog.bubustack.io
  resources:
  - impulsetemplates
  verbs:
  - '*'
- apiGroups:
  - catalog.bubustack.io
  resources:
  - impulsetemplates/status
  verbs:
  - get
