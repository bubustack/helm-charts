apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bobrapet.fullname" . }}-runs-steprun-admin-role
  labels:
  {{- include "bobrapet.labels" . | nindent 4 }}
rules:
- apiGroups:
  - runs.bubustack.io
  resources:
  - stepruns
  verbs:
  - '*'
- apiGroups:
  - runs.bubustack.io
  resources:
  - stepruns/status
  verbs:
  - get
