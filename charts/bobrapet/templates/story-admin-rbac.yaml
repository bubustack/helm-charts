apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bobrapet.fullname" . }}-story-admin-role
  labels:
  {{- include "bobrapet.labels" . | nindent 4 }}
rules:
- apiGroups:
  - bubustack.io
  resources:
  - stories
  verbs:
  - '*'
- apiGroups:
  - bubustack.io
  resources:
  - stories/status
  verbs:
  - get
