apiVersion: v1
kind: Service
metadata:
  name: {{ include "bobrapet.fullname" . }}-webhook-service
  labels:
  {{- include "bobrapet.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webhookService.type }}
  selector:
    app.kubernetes.io/name: bobrapet
    control-plane: controller-manager
    {{- include "bobrapet.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.webhookService.ports | toYaml | nindent 2 }}
