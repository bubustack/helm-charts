name: Publish Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # Required for cosign keyless signing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Lint charts
        run: |
          set -euo pipefail
          for chart in charts/*/Chart.yaml; do
            chart_dir=$(dirname "$chart")
            echo "::group::Linting ${chart_dir}"
            helm lint "$chart_dir"
            echo "::endgroup::"
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          charts_dir: charts
          skip_existing: true

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push packages to GHCR and sign with cosign
        env:
          OCI_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts
        run: |
          set -euo pipefail
          if ls .cr-release-packages/*.tgz >/dev/null 2>&1; then
            echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
            for chart in .cr-release-packages/*.tgz; do
              echo "Publishing ${chart} to ${OCI_REGISTRY}"
              PUSH_OUTPUT=$(helm push "${chart}" "oci://${OCI_REGISTRY}" 2>&1)
              echo "${PUSH_OUTPUT}"

              # Extract chart name and digest from helm push output
              CHART_NAME=$(helm show chart "${chart}" | grep '^name:' | awk '{print $2}')
              DIGEST=$(echo "${PUSH_OUTPUT}" | grep 'Digest:' | awk '{print $2}')

              echo "Signing ${OCI_REGISTRY}/${CHART_NAME}@${DIGEST} with cosign (keyless)"
              cosign sign --yes "${OCI_REGISTRY}/${CHART_NAME}@${DIGEST}"
            done
          else
            echo "No chart packages produced in this run."
          fi
